[pytest]
testpaths = tests
# Avisos de librerías de terceros que no podemos corregir aquí; los de Timbra siguen saliendo.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.*
    ignore:HarfBuzz-Subset will be required:DeprecationWarning:weasyprint.*
    ignore:X509.get_subject is deprecated:DeprecationWarning:satcfdi.*
    ignore::DeprecationWarning:OpenSSL.*
